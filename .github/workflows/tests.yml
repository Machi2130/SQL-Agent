name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # Tests use SQLite and need no database server, Groq key or Redis.
      - run: python -m pytest tests -q
        env:
          PYTHONUTF8: "1"
          GROQ_API_KEY: ""
